[project]
name = "signpost-app"
version = "0.1.0"
description = "LangGraph app: five Northwind Outdoor Gear agents routed by Signpost, with DynamoDB checkpointing and message pruning"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "anthropic",
    "langgraph-dynamodb-checkpoint[reducer]>=0.5.0",
    "boto3",
    "torch",
    "transformers==5.17.0",
    "safetensors",
]

[tool.uv]
package = false
